<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta name="description" content="查询你的本命太岁星君">
    <!-- 微信分享相关 -->
    <meta property="og:title" content="本命太岁星君查询">
    <meta property="og:description" content="快来查询你的本命太岁星君">
    <meta property="og:image" content="share-image.png">
    <title>本命太岁星君查询</title>
    <link rel="stylesheet" href="style.css">
    <!-- 引入农历转换库 -->
    <script src="https://cdn.jsdelivr.net/npm/lunar-javascript/dist/lunar.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="input-section" id="inputSection">
            <h1>本命太岁星君查询</h1>
            <div class="birth-year">
                <select id="year" name="year">
                    <option value="">选择出生年份</option>
                </select>
            </div>
            <div class="lichun-options">
                <label>
                    <input type="radio" name="lichun" value="before" checked> 立春前
                </label>
                <label>
                    <input type="radio" name="lichun" value="after"> 立春后
                </label>
            </div>
            <div class="note">
                <p>注：如果您出生在农历春节到立春之间，请选择"立春前"</p>
            </div>
            <button id="submitBtn" class="submit-btn">查看你的本命太岁星君</button>
        </div>
        
        <div class="result-section" id="resultSection" style="display: none;">
            <div class="result-content">
                <img id="resultImage" src="" alt="太岁星君">
                <div class="result-info">
                    <h2 id="yearInfo"></h2>
                    <p id="additionalInfo"></p>
                </div>
            </div>
            <div class="share-section">
                <p class="share-tip">长按图片保存或分享到朋友圈</p>
            </div>
            <button class="back-btn" onclick="showInputSection()">返回重新查询</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
